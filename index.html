<body class="min-h-screen flex flex-col items-center justify-between p-4 overflow-x-hidden">

        <div class="flex items-center space-x-3">
            <button onclick="router('home')" class="bg-yellow-400 hover:bg-yellow-500 text-white font-kids px-4 py-2 rounded-2xl shadow-md border-b-4 border-yellow-600 transition flex items-center gap-2 text-lg">
                🏠 Home
            </button>
            <div id="character-avatar" class="text-4xl bouncing cursor-pointer" onclick="teacherTalk('Hello little hero! Ready to play and learn?')">🦊</div>
        </div>
        <div class="flex items-center space-x-4">
            <div class="flex items-center bg-yellow-100 px-4 py-2 rounded-2xl border-2 border-yellow-300 shadow-inner">

                <span id="star-count" class="font-kids text-xl text-yellow-600">0</span>
            </div>
            <div class="flex items-center bg-amber-100 px-4 py-2 rounded-2xl border-2 border-amber-300 shadow-inner">
                <span class="text-2xl mr-2">🪙</span>
                <span id="coin-count" class="font-kids text-xl text-amber-600">0</span>
            </div>
            <button onclick="toggleAudio()" id="audio-toggle-btn" class="bg-pink-400 hover:bg-pink-500 text-white font-kids p-3 rounded-2xl shadow-md border-b-4 border-pink-600 transition text-xl">
                🔊
            </button>
        </div>
    </header>

    <!-- Main Container Card -->
    <main id="app-container" class="w-full max-w-4xl bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-6 border-8 border-indigo-200 flex flex-col items-center justify-center min-h-[550px] relative overflow-hidden">

    <!-- Footer Teacher Guide Bar -->

            <span class="text-3xl">🦉</span>
            <div>

                <p id="teacher-speech" class="text-xs md:text-sm font-semibold">"Tap buttons to start your magical learning adventure!"</p>

            ☁️ Save Progress

                { word: "Pencil", emoji: "✏️", sentence: "We draw wonderful pictures with a pencil." },
                { word: "Cup", emoji: "🥤", sentence: "We drink refreshing water from a cup." },
                { word: "Toothbrush", emoji: "🪥", sentence: "We brush our teeth sparkling clean every day." }
            ],
            PLACES: [
                { word: "School", emoji: "🏫", sentence: "We learn new exciting things at school." },
                { word: "Hospital", emoji: "🏥", sentence: "Doctors and nurses help patients at the hospital." },
                { word: "Park", emoji: "🌳", sentence: "We play on swings and slides at the park." },
                { word: "Zoo", emoji: "🦁", sentence: "We visit wild exotic animals at the zoo." },
                { word: "Supermarket", emoji: "🛒", sentence: "We buy fresh groceries at the supermarket." },
                { word: "Library", emoji: "📚", sentence: "Quiet libraries are full of thousands of books." },
                { word: "Beach", emoji: "🏖️", sentence: "We build sandcastles by the ocean beach." },
                { word: "Airport", emoji: "🛫", sentence: "Airplanes take off and land at the airport." }
            ]
        };

        // Text-to-Speech Helper
        function speak(text) {
            if (!state.soundEnabled) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.85; // Slower for kids
                utterance.pitch = 1.2;  // Friendly higher pitch
                window.speechSynthesis.speak(utterance);
            }
        }

        function teacherTalk(message) {
            document.getElementById('teacher-speech').innerText = `"${message}"`;
            speak(message);
        }

        function toggleAudio() {
            state.soundEnabled = !state.soundEnabled;
            const btn = document.getElementById('audio-toggle-btn');
            btn.innerText = state.soundEnabled ? '🔊' : '🔇';
            btn.classList.toggle('bg-pink-400', state.soundEnabled);
            btn.classList.toggle('bg-gray-400', !state.soundEnabled);
        }

        function updateStatsDisplay() {
            document.getElementById('star-count').innerText = state.stars;
            document.getElementById('coin-count').innerText = state.coins;
        }

        // Router / Navigation Manager
        function router(view, param = null) {
            state.currentView = view;
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            if (view === 'home') {
                renderHome(container);
            } else if (view === 'learn-menu') {
                renderLearnMenu(container);
            } else if (view === 'vocab-session') {
                state.activeCategory = param || 'VEGETABLES';
                state.currentIndex = 0;
                renderVocabSession(container);
            } else if (view === 'story-adventure') {
                renderStoryAdventure(container);
            } else if (view === 'games-menu') {
                renderGamesMenu(container);
            } else if (view === 'game-play') {
                renderGamePlay(container, param);
            } else if (view === 'exam') {
                renderExam(container);
            } else if (view === 'progress') {
                renderProgress(container);
            } else if (view === 'rewards') {
                renderRewards(container);
            }
            updateStatsDisplay();
        }

        // 1. HOME MENU
        function renderHome(container) {
            teacherTalk("Welcome back! What shall we explore today?");
            container.innerHTML = `
                <div class="text-center mb-6">
                    <h1 class="font-kids text-4xl md:text-5xl text-indigo-600 drop-shadow-md mb-2">🌟 Vocab Adventure 🚀</h1>

                </div>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4 w-full max-w-2xl px-2">
                    <button onclick="router('learn-menu')" class="card-3d bg-gradient-to-br from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white font-kids p-4 rounded-3xl shadow-lg border-b-8 border-orange-700 flex flex-col items-center justify-center space-y-2 text-xl">
                        <span class="text-4xl">📚</span> Learn Vocab
                    </button>
                    <button onclick="router('story-adventure')" class="card-3d bg-gradient-to-br from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-kids p-4 rounded-3xl shadow-lg border-b-8 border-teal-700 flex flex-col items-center justify-center space-y-2 text-xl">
                        <span class="text-4xl">📖</span> Story World
                    </button>
                    <button onclick="router('games-menu')" class="card-3d bg-gradient-to-br from-sky-400 to-blue-600 hover:from-sky-500 hover:to-blue-700 text-white font-kids p-4 rounded-3xl shadow-lg border-b-8 border-blue-800 flex flex-col items-center justify-center space-y-2 text-xl">
                        <span class="text-4xl">🎮</span> Play Games
                    </button>
                    <button onclick="router('exam')" class="card-3d bg-gradient-to-br from-purple-400 to-indigo-600 hover:from-purple-500 hover:to-indigo-700 text-white font-kids p-4 rounded-3xl shadow-lg border-b-8 border-indigo-800 flex flex-col items-center justify-center space-y-2 text-xl">
                        <span class="text-4xl">🏆</span> Challenge Exam
                    </button>
                    <button onclick="router('progress')" class="card-3d bg-gradient-to-br from-pink-400 to-rose-500 hover:from-pink-500 hover:to-rose-600 text-white font-kids p-4 rounded-3xl shadow-lg border-b-8 border-rose-700 flex flex-col items-center justify-center space-y-2 text-xl">
                        <span class="text-4xl">📊</span> My Progress
                    </button>
                    <button onclick="router('rewards')" class="card-3d bg-gradient-to-br from-yellow-300 to-amber-500 hover:from-yellow-400 hover:to-amber-600 text-white font-kids p-4 rounded-3xl shadow-lg border-b-8 border-amber-700 flex flex-col items-center justify-center space-y-2 text-xl">
                        <span class="text-4xl">🎁</span> Rewards Shop
                    </button>
                </div>
            `;
        }

        // 2. LEARN VOCABULARY CATEGORIES MENU
        function renderLearnMenu(container) {
            teacherTalk("Choose a category to discover amazing words!");
            const categories = Object.keys(vocabDatabase);
            let gridHTML = categories.map(cat => `
                <button onclick="router('vocab-session', '${cat}')" class="card-3d bg-white hover:bg-indigo-50 border-4 border-indigo-200 p-4 rounded-3xl shadow-md flex flex-col items-center justify-center space-y-1 transition">
                    <span class="text-3xl">${getCategoryIcon(cat)}</span>
                    <span class="font-kids text-indigo-700 text-base capitalize">${cat.toLowerCase()}</span>
                </button>
            `).join('');

            container.innerHTML = `
                <div class="flex items-center justify-between w-full mb-4">
                    <button onclick="router('home')" class="bg-gray-200 hover:bg-gray-300 font-kids px-4 py-2 rounded-2xl text-gray-700">⬅️ Back</button>
                    <h2 class="font-kids text-2xl text-indigo-700">Choose Vocabulary Topic</h2>
                    <div></div>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 w-full max-h-[400px] overflow-y-auto p-2">
                    ${gridHTML}
                </div>
            `;
        }

        function getCategoryIcon(cat) {
            const icons = {
                VEGETABLES: '🥕', FRUITS: '🍎', OCCUPATIONS: '🩺', VEHICLES: '🚗',
                SHAPES: '⭐', COLORS: '🎨', ANIMALS: '🐶', BODYPARTS: '👁️',
                DAILYOBJECTS: '📚', PLACES: '🏫'
            };
            return icons[cat] || '🌟';
        }

        // 3. VOCABULARY LEARNING SESSION (Step-by-step)
        function renderVocabSession(container) {
            const list = vocabDatabase[state.activeCategory];
            if (state.currentIndex >= list.length) {
                // Session Complete reward celebration
                state.stars += 5;
                state.coins += 20;
                state.vocabularyLearned += list.length;
                state.gamesCompleted += 1;
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                
                container.innerHTML = `
                    <div class="text-center space-y-4">
                        <div class="text-6xl bouncing">🎉</div>
                        <h2 class="font-kids text-3xl text-indigo-700">Awesome Job!</h2>
                        <p class="font-semibold text-gray-600">You completed the ${state.activeCategory} adventure!</p>
                        <div class="flex justify-center space-x-4 text-xl font-kids text-amber-600 bg-yellow-100 p-3 rounded-2xl">
                            <span>+5 ⭐</span>
                            <span>+20 🪙</span>
                        </div>
                        <button onclick="router('learn-menu')" class="card-3d bg-emerald-500 text-white font-kids px-6 py-3 rounded-2xl shadow-lg border-b-4 border-emerald-700 text-xl">Continue Learning 🚀</button>
                    </div>
                `;
                return;
            }

            const item = list[state.currentIndex];
            teacherTalk(`Look at the ${item.word}! Listen and repeat.`);

            container.innerHTML = `
                <div class="w-full flex justify-between items-center mb-2">
                    <button onclick="router('learn-menu')" class="bg-gray-200 hover:bg-gray-300 font-kids px-3 py-1 rounded-xl text-xs text-gray-700">⬅️ Topics</button>
                    <span class="font-kids text-indigo-500 text-sm">Item ${state.currentIndex + 1} of ${list.length}</span>
                </div>
                <div class="bg-gradient-to-b from-indigo-50 to-pink-50 p-6 rounded-3xl border-4 border-indigo-200 shadow-inner flex flex-col items-center text-center w-full max-w-md">
                    <div class="text-8xl md:text-9xl mb-4 bouncing cursor-pointer" onclick="speak('${item.word}')">${item.emoji}</div>
                    <h2 class="font-kids text-4xl text-indigo-700 mb-2">${item.word}</h2>
                    <p class="font-semibold text-gray-600 text-sm md:text-base mb-6 bg-white px-4 py-2 rounded-2xl shadow-sm border border-indigo-100">"${item.sentence}"</p>
                    
                    <div class="flex space-x-3 w-full">
                        <button onclick="speak('${item.word}')" class="flex-1 card-3d bg-sky-400 hover:bg-sky-500 text-white font-kids py-3 rounded-2xl shadow-lg border-b-4 border-sky-600 text-lg flex items-center justify-center gap-2">
                            🔊 Listen
                        </button>
                        <button onclick="nextVocabItem()" class="flex-1 card-3d bg-emerald-500 hover:bg-emerald-600 text-white font-kids py-3 rounded-2xl shadow-lg border-b-4 border-emerald-700 text-lg flex items-center justify-center gap-2">
                            Next ➡️
                        </button>
                    </div>
                </div>
            `;
            speak(item.word);
        }

        function nextVocabItem() {
            state.currentIndex++;
            renderVocabSession(document.getElementById('app-container'));
        }

        // 4. STORY ADVENTURE WORLD MAP
        function renderStoryAdventure(container) {
            teacherTalk("Welcome to Story Adventure! Choose a magical world to explore!");
            container.innerHTML = `
                <div class="w-full flex justify-between items-center mb-4">
                    <button onclick="router('home')" class="bg-gray-200 font-kids px-4 py-2 rounded-2xl text-gray-700">⬅️ Home</button>
                    <h2 class="font-kids text-2xl text-indigo-700">Adventure World Map</h2>
                    <div></div>

        // Firebase Cloud Sync Integration
        function syncToCloud() {
            if (window.db && window.dbSet && window.dbRef) {
                window.dbSet(window.dbRef(window.db, 'user_progress/child_hero'), {
                    stars: state.stars,
                    coins: state.coins,
                    vocabularyLearned: state.vocabularyLearned,
                    gamesCompleted: state.gamesCompleted,
                    lastUpdated: new Date().toISOString()
                }).then(() => {
                    teacherTalk("Cloud sync successful! Progress saved safely.");
                }).catch((error) => {
                    teacherTalk("Cloud sync failed. Playing offline smoothly!");
                });
            } else {
                teacherTalk("Progress saved locally!");
            }
        }

        // Initialize App on Load
        window.onload = function() {
            router('home');
        };
