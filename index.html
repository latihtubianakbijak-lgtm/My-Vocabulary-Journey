            wordsLearned: 0,
            correctAnswers: 0,
            timePlayed: 0, // in seconds
            soundEnabled: true,
            currentCategory: null,
            gameQueue: [],
            currentQuestionIndex: 0,
            currentClueIndex: 0,
            scoreThisSession: 0
        };

        // Timer interval
        setInterval(() => {
            gameState.timePlayed++;
        }, 1000);

        // Load stats from localStorage if available
        function loadStats() {
            const saved = localStorage.getItem('myFirstWordsState');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    gameState.stars = parsed.stars || 0;
                    gameState.wordsLearned = parsed.wordsLearned || 0;
                    gameState.correctAnswers = parsed.correctAnswers || 0;
                    gameState.timePlayed = parsed.timePlayed || 0;
                } catch(e) {}
            }
            updateStarDisplay();
        }

        function saveStats() {
            localStorage.setItem('myFirstWordsState', JSON.stringify({
                stars: gameState.stars,
                wordsLearned: gameState.wordsLearned,
                correctAnswers: gameState.correctAnswers,
                timePlayed: gameState.timePlayed
            }));

            // Sync to Firebase if connected
            if (db) {
                db.ref('stats/user_global').set({
                    stars: gameState.stars,
                    wordsLearned: gameState.wordsLearned,
                    correctAnswers: gameState.correctAnswers,
                    lastUpdated: Date.now()
                }).catch(() => {});
            }
        }

        function updateStarDisplay() {
            document.getElementById('star-count').innerText = gameState.stars;
        }

        // --- AUDIO SYNTHESIS & SOUND FX ---
        function playSoundEffect(type) {
            if (!gameState.soundEnabled) return;
            const synth = window.speechSynthesis;
            if (!synth) return;
            
            if (type === 'correct') {
                const utter = new SpeechSynthesisUtterance("Yay! Great job!");
                utter.rate = 1.2;
                synth.speak(utter);
            } else if (type === 'incorrect') {
                const utter = new SpeechSynthesisUtterance("Try again!");
                utter.rate = 1.0;
                synth.speak(utter);
            }
        }

        function speakText(text) {
            if (!gameState.soundEnabled) return;
            const synth = window.speechSynthesis;
            if (!synth) return;
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.rate = 0.9;
            utter.pitch = 1.2; // Kid friendly pitch
            synth.speak(utter);
        }

        function toggleSound() {
            gameState.soundEnabled = !gameState.soundEnabled;
            const btn = document.getElementById('sound-btn');
            btn.innerText = gameState.soundEnabled ? "🔊" : "🔇";
            speakText(gameState.soundEnabled ? "Sound on" : "Sound off");
        }

        // --- VIEW ROUTER ---
        function renderHomeScreen() {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="flex flex-col items-center text-center animate-pulse-scale">
                    <div class="text-7xl sm:text-8xl mb-2 animate-bounce-slow">🐱‍👤</div>
                    <h1 class="font-fun text-4xl sm:text-6xl text-rose-500 drop-shadow-md mb-1">Who Am I?</h1>
                    <p class="font-fun text-lg sm:text-2xl text-purple-600 mb-6 drop-shadow-sm">Read the clues. Guess the picture!</p>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-md px-4">
                        <button onclick="router('categories', 'game')" class="btn-3d bg-emerald-400 hover:bg-emerald-500 text-white font-fun text-xl sm:text-2xl py-4 px-6 rounded-3xl flex items-center justify-center gap-3 border-4 border-emerald-200">
                            <span>▶</span> Start Game
                        </button>
                        <button onclick="router('categories', 'learn')" class="btn-3d bg-amber-400 hover:bg-amber-500 text-white font-fun text-xl sm:text-2xl py-4 px-6 rounded-3xl flex items-center justify-center gap-3 border-4 border-amber-200">
                            <span>📚</span> Learn Words
                        </button>
                        <button onclick="renderRewards()" class="btn-3d bg-sky-400 hover:bg-sky-500 text-white font-fun text-xl sm:text-2xl py-4 px-6 rounded-3xl flex items-center justify-center gap-3 border-4 border-sky-200 col-span-1 sm:col-span-2">
                            <span>🏆</span> My Rewards
                        </button>
                    </div>
                </div>
            `;
            speakText("Welcome to Who Am I! Choose a game or learn words!");
        }

        let currentAppMode = 'game'; // 'game' or 'learn'

        function router(view, mode = 'game') {
            currentAppMode = mode;
            if (view === 'home') {
                renderHomeScreen();
            } else if (view === 'categories') {
                renderCategorySelection();
            }
        }

        // --- CATEGORY SELECTION VIEW ---
        function renderCategorySelection() {
            const categories = Object.keys(vocabData);
            const container = document.getElementById('app-container');
            
            let gridHtml = '';
            categories.forEach(cat => {
                let sampleEmoji = vocabData[cat][0].emoji;
                gridHtml += `
                    <button onclick="selectCategory('${cat}')" class="btn-3d bg-white hover:bg-purple-50 p-4 rounded-3xl flex flex-col items-center justify-center border-4 border-purple-200 shadow-lg transition-transform active:scale-95 group">
                        <span class="text-4xl sm:text-5xl mb-2 group-hover:scale-110 transition-transform">${sampleEmoji}</span>
                        <span class="font-fun text-base sm:text-lg text-purple-700">${cat}</span>
                    </button>
                `;
            });

            container.innerHTML = `
                <div class="w-full flex flex-col items-center">
                    <div class="w-full flex justify-between items-center mb-4 px-2">
                        <button onclick="router('home')" class="bg-white/80 hover:bg-white px-4 py-2 rounded-2xl font-fun text-purple-600 shadow-md border-2 border-purple-300">
                            ⬅ Back
                        </button>
                        <h2 class="font-fun text-2xl sm:text-3xl text-purple-700 drop-shadow-sm">
                            ${currentAppMode === 'game' ? '🎮 Choose a Game Category' : '📚 Choose Learning Topic'}
                        </h2>
                        <div class="w-16"></div>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 sm:gap-4 w-full max-h-[70vh] overflow-y-auto p-2">
                        ${gridHtml}
                    </div>
                </div>
            `;
            speakText("Pick a category!");
        }

        function selectCategory(categoryName) {
            gameState.currentCategory = categoryName;
            if (currentAppMode === 'game') {
                startQuizGame(categoryName);
            } else {
                startLearnMode(categoryName);
            }
        }

        // --- GAME MODE: WHO AM I? ---
        function startQuizGame(categoryName) {
            const items = [...vocabData[categoryName]];
            // Shuffle items for randomization
            gameState.gameQueue = items.sort(() => 0.5 - Math.random());
            gameState.currentQuestionIndex = 0;
            gameState.currentClueIndex = 0;
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            const qList = gameState.gameQueue;
            if (gameState.currentQuestionIndex >= qList.length) {
                renderVictoryScreen();
                return;
            }

            const currentItem = qList[gameState.currentQuestionIndex];
            const maxClues = currentItem.clues.length;
            const currentClue = currentItem.clues[gameState.currentClueIndex];

            // Generate 3 choices (1 correct, 2 distractors from same category or pool)
            let choices = [currentItem];
            let allPool = Object.values(vocabData).flat().filter(i => i.name !== currentItem.name);
            allPool = allPool.sort(() => 0.5 - Math.random());
            choices.push(allPool[0], allPool[1]);
            choices = choices.sort(() => 0.5 - Math.random());

            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full max-w-xl flex flex-col items-center bg-white/90 backdrop-blur-md p-6 rounded-3xl shadow-2xl border-4 border-amber-300">
                    <div class="w-full flex justify-between items-center mb-4">
                        <button onclick="router('categories', 'game')" class="bg-amber-100 hover:bg-amber-200 px-3 py-1 rounded-xl font-fun text-amber-700 text-sm">
                            ⬅ Categories
                        </button>
                        <span class="font-fun text-amber-600">Question ${gameState.currentQuestionIndex + 1} of ${qList.length}</span>
                    </div>

                    <h2 class="font-fun text-3xl text-purple-700 mb-2">Who Am I?</h2>
                    
                    <!-- Mystery Silhouette Box -->
                    <div class="w-32 h-32 sm:w-40 sm:h-40 bg-purple-100 rounded-3xl flex items-center justify-center border-4 border-dashed border-purple-300 mb-4 shadow-inner">
                        <span class="text-6xl sm:text-7xl animate-pulse">❓</span>
                    </div>

                    <!-- Clue Card -->
                    <div class="w-full bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 mb-6 text-center shadow-sm">
                        <span class="text-xs font-bold uppercase tracking-wider text-amber-600 block mb-1">Clue ${gameState.currentClueIndex + 1} of ${maxClues}</span>
                        <p class="font-fun text-xl sm:text-2xl text-slate-700" id="clue-text">"${currentClue}"</p>
                        <button onclick="speakText('${currentClue}')" class="mt-2 bg-amber-200 hover:bg-amber-300 px-3 py-1 rounded-full font-fun text-xs text-amber-800">
                            🔊 Read Clue
                        </button>
                    </div>

                    <!-- Answer Choices Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 w-full">
                        ${choices.map((choice, idx) => `
                            <button onclick="checkAnswer('${choice.name}', '${currentItem.name}')" class="btn-3d bg-purple-100 hover:bg-purple-200 border-3 border-purple-300 p-4 rounded-2xl flex flex-col items-center justify-center gap-2 transition-transform active:scale-95">
                                <span class="text-3xl">${choice.emoji}</span>
                                <span class="font-fun text-purple-800 text-lg">${choice.name}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
            speakText(`Who am I? ${currentClue}`);
        }

        function checkAnswer(selectedName, correctName) {
            const currentItem = vocabData[gameState.currentCategory].find(i => i.name === correctName);
            const maxClues = currentItem.clues.length;

            if (selectedName === correctName) {
                // Correct Answer!
                gameState.stars += 1;
                gameState.correctAnswers += 1;
                gameState.wordsLearned += 1;
                saveStats();
                playSoundEffect('correct');

                if (typeof confetti === 'function') {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                }

                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <div class="w-full max-w-xl flex flex-col items-center bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl border-4 border-emerald-300 text-center animate-pulse-scale">
                        <div class="text-7xl mb-2">🎉</div>
                        <h2 class="font-fun text-4xl text-emerald-600 mb-2">Great Job!</h2>
                        <p class="font-fun text-2xl text-slate-700 mb-4">Yay! You got it! It's a ${currentItem.name} ${currentItem.emoji}</p>
                        <div class="bg-emerald-50 border-2 border-emerald-200 px-6 py-3 rounded-2xl mb-6 font-fun text-xl text-emerald-700">
                            ⭐ +1 Star Earned!
                        </div>
                        <button onclick="nextQuestion()" class="btn-3d bg-emerald-500 hover:bg-emerald-600 text-white font-fun text-xl py-3 px-8 rounded-2xl">
                            Next Question ➡
                        </button>
                    </div>
                `;
                speakText(`Yay! You got it! It's a ${currentItem.name}`);
            } else {
                // Incorrect Answer -> Provide next clue if available, else retry
                playSoundEffect('incorrect');
                if (gameState.currentClueIndex < maxClues - 1) {
                    gameState.currentClueIndex++;
                    renderQuizQuestion();
                } else {
                    showIncorrectFeedback(currentItem);
                }
            }
        }

        function showIncorrectFeedback(currentItem) {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full max-w-xl flex flex-col items-center bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl border-4 border-rose-300 text-center">
                    <div class="text-6xl mb-2">💡</div>
                    <h2 class="font-fun text-3xl text-rose-500 mb-2">Try Again!</h2>
                    <p class="font-fun text-xl text-slate-700 mb-4">Look at my color and features!</p>
                    <button onclick="renderQuizQuestion()" class="btn-3d bg-rose-400 hover:bg-rose-500 text-white font-fun text-xl py-3 px-8 rounded-2xl">
                        Try Again 🔄
                    </button>
                </div>
            `;
            speakText("Try again! Look at my color.");
        }

        function nextQuestion() {
            gameState.currentQuestionIndex++;
            gameState.currentClueIndex = 0;
            renderQuizQuestion();
        }

        function renderVictoryScreen() {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full max-w-xl flex flex-col items-center bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl border-4 border-amber-300 text-center">
                    <div class="text-7xl mb-2">🏆</div>
                    <h2 class="font-fun text-4xl text-amber-500 mb-2">Fantastic!</h2>
                    <p class="font-fun text-xl text-slate-700 mb-6">You finished all questions in this category!</p>
                    <div class="flex gap-4 justify-center">
                        <button onclick="router('categories', 'game')" class="btn-3d bg-purple-500 hover:bg-purple-600 text-white font-fun text-lg py-3 px-6 rounded-2xl">
                            More Games 🎮
                        </button>
                        <button onclick="router('home')" class="btn-3d bg-sky-400 hover:bg-sky-500 text-white font-fun text-lg py-3 px-6 rounded-2xl">
                            Home 🏠
                        </button>
                    </div>
                </div>
            `;
            speakText("Fantastic! You finished all questions!");
            if (typeof confetti === 'function') {
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 } });
            }
        }

        // --- LEARNING MODE (FLASHCARDS) ---
        function startLearnMode(categoryName) {
            const items = vocabData[categoryName];
            let currentIndex = 0;

            function renderCard() {
                const item = items[currentIndex];
                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <div class="w-full max-w-xl flex flex-col items-center bg-white/95 backdrop-blur-md p-6 sm:p-8 rounded-3xl shadow-2xl border-4 border-amber-300">
                        <div class="w-full flex justify-between items-center mb-4">
                            <button onclick="router('categories', 'learn')" class="bg-amber-100 hover:bg-amber-200 px-3 py-1 rounded-xl font-fun text-amber-700 text-sm">
                                ⬅ Categories
                            </button>
                            <span class="font-fun text-amber-600">${currentIndex + 1} / ${items.length}</span>
                        </div>

                        <!-- 3D Picture Flashcard -->
                        <div class="w-48 h-48 sm:w-56 sm:h-56 bg-amber-50 rounded-3xl flex flex-col items-center justify-center border-4 border-amber-200 mb-4 shadow-md relative">
                            <span class="text-8xl sm:text-9xl mb-2 animate-bounce-slow">${item.emoji}</span>
                        </div>

                        <!-- Word & Pronunciation -->
                        <div class="flex items-center gap-3 mb-3">
                            <h2 class="font-fun text-3xl sm:text-4xl text-purple-700 uppercase tracking-wide">${item.name}</h2>
                            <button onclick="speakText('${item.name}')" class="bg-purple-200 hover:bg-purple-300 p-2 rounded-full text-xl shadow">
                                🔊
                            </button>
                        </div>

                        <!-- Simple Sentence -->
                        <div class="bg-purple-50 border-2 border-purple-200 rounded-2xl p-4 w-full text-center mb-6">
                            <p class="font-fun text-lg sm:text-xl text-slate-700">"${item.sentence}"</p>
                            <button onclick="speakText('${item.sentence}')" class="mt-2 bg-purple-200 hover:bg-purple-300 px-3 py-1 rounded-full font-fun text-xs text-purple-800">
                                🔊 Read Sentence
                            </button>
                        </div>

                        <!-- Navigation Controls -->
                        <div class="flex justify-between w-full gap-4">
                            <button onclick="prevCard()" ${currentIndex === 0 ? 'disabled class="opacity-50 cursor-not-allowed btn-3d bg-slate-300 text-white font-fun px-6 py-3 rounded-2xl flex-1"' : 'class="btn-3d bg-amber-400 hover:bg-amber-500 text-white font-fun px-6 py-3 rounded-2xl flex-1"'}>
                                ⬅ Prev
                            </button>
                            <button onclick="nextCard()" ${currentIndex === items.length - 1 ? 'disabled class="opacity-50 cursor-not-allowed btn-3d bg-slate-300 text-white font-fun px-6 py-3 rounded-2xl flex-1"' : 'class="btn-3d bg-emerald-400 hover:bg-emerald-500 text-white font-fun px-6 py-3 rounded-2xl flex-1"'}>
                                Next ➡
                            </button>
                        </div>
                    </div>
                `;
                speakText(item.name);
            }

            window.nextCard = function() {
                if (currentIndex < items.length - 1) {
                    currentIndex++;
                    renderCard();
                }
            };

            window.prevCard = function() {
                if (currentIndex > 0) {
                    currentIndex--;
                    renderCard();
                }
            };

            renderCard();
        }

        // --- REWARDS SYSTEM ---
        function renderRewards() {
            const stars = gameState.stars;
            let badge = "Beginner Learner";
            if (stars >= 50) badge = "Word Master 👑";
            else if (stars >= 30) badge = "Vocabulary Explorer 🚀";
            else if (stars >= 10) badge = "Super Learner ⭐";

            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full max-w-xl flex flex-col items-center bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl border-4 border-sky-300 text-center">
                    <div class="w-full flex justify-between items-center mb-4">
                        <button onclick="router('home')" class="bg-sky-100 hover:bg-sky-200 px-3 py-1 rounded-xl font-fun text-sky-700 text-sm">
                            ⬅ Home
                        </button>
                        <h2 class="font-fun text-2xl text-sky-700">My Rewards</h2>
                        <div class="w-12"></div>
                    </div>

                    <div class="text-7xl mb-3 animate-bounce-slow">🏆</div>
                    <div class="font-fun text-4xl text-amber-500 mb-1">${stars} Stars</div>
                    <p class="font-fun text-xl text-purple-600 mb-6">Current Badge: <span class="text-rose-500">${badge}</span></p>

                    <!-- Milestone Checklist -->
                    <div class="w-full bg-sky-50 border-2 border-sky-200 rounded-2xl p-4 flex flex-col gap-3 text-left">
                        <div class="flex items-center justify-between font-fun text-slate-700">
                            <span>⭐ 10 Stars: Super Learner</span>
                            <span>${stars >= 10 ? '✅' : '🔒'}</span>
                        </div>
                        <div class="flex items-center justify-between font-fun text-slate-700">
                            <span>⭐ 30 Stars: Vocabulary Explorer</span>
                            <span>${stars >= 30 ? '✅' : '🔒'}</span>
                        </div>
                        <div class="flex items-center justify-between font-fun text-slate-700">
                            <span>⭐ 50 Stars: Word Master</span>
                            <span>${stars >= 50 ? '✅' : '🔒'}</span>
                        </div>
                    </div>
                </div>
            `;
            speakText(`You have ${stars} stars! Your badge is ${badge}`);
        }

        // --- PARENT MODE ---
        let mathA = 3;
        let mathB = 4;

        function openParentMode() {
            mathA = Math.floor(Math.random() * 5) + 1;
            mathB = Math.floor(Math.random() * 5) + 1;
            document.getElementById('math-question').innerText = `${mathA} + ${mathB} = ?`;
            document.getElementById('math-answer').value = '';
            document.getElementById('pin-modal').classList.remove('hidden');
        }

        function closeParentMode() {
            document.getElementById('pin-modal').classList.add('hidden');
        }

        function verifyPin() {
            const val = parseInt(document.getElementById('math-answer').value);
            if (val === mathA + mathB) {
                closeParentMode();
                renderParentDashboard();
            } else {
                alert("Incorrect answer! Try again.");
            }
        }

        function renderParentDashboard() {
            const minutesPlayed = Math.floor(gameState.timePlayed / 60);
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full max-w-xl flex flex-col items-center bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl border-4 border-purple-400">
                    <div class="w-full flex justify-between items-center mb-4">
                        <button onclick="router('home')" class="bg-purple-100 hover:bg-purple-200 px-3 py-1 rounded-xl font-fun text-purple-700 text-sm">
                            ⬅ Exit Parent Mode
                        </button>
                        <h2 class="font-fun text-2xl text-purple-700">👨‍👩‍👧 Parent Dashboard</h2>
                        <div class="w-12"></div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 w-full mb-6">
                        <div class="bg-purple-50 border-2 border-purple-200 p-4 rounded-2xl text-center">
                            <span class="text-3xl block mb-1">⭐</span>
                            <span class="font-fun text-2xl text-purple-700">${gameState.stars}</span>
                            <p class="text-xs text-slate-500 font-bold uppercase">Stars Collected</p>
                        </div>
                        <div class="bg-emerald-50 border-2 border-emerald-200 p-4 rounded-2xl text-center">
                            <span class="text-3xl block mb-1">📚</span>
                            <span class="font-fun text-2xl text-emerald-700">${gameState.wordsLearned}</span>
                            <p class="text-xs text-slate-500 font-bold uppercase">Words Learned</p>
                        </div>
                        <div class="bg-amber-50 border-2 border-amber-200 p-4 rounded-2xl text-center">
                            <span class="text-3xl block mb-1">🎯</span>
                            <span class="font-fun text-2xl text-amber-700">${gameState.correctAnswers}</span>
                            <p class="text-xs text-slate-500 font-bold uppercase">Correct Answers</p>
                        </div>
                        <div class="bg-sky-50 border-2 border-sky-200 p-4 rounded-2xl text-center">
                            <span class="text-3xl block mb-1">⏱️</span>
                            <span class="font-fun text-2xl text-sky-700">${minutesPlayed} min</span>
                            <p class="text-xs text-slate-500 font-bold uppercase">Time Played</p>
                        </div>
                    </div>

                    <button onclick="resetStats()" class="bg-rose-100 hover:bg-rose-200 text-rose-600 font-fun px-4 py-2 rounded-xl text-sm">
                        Reset Progress
                    </button>
                </div>
            `;
        }

        function resetStats() {
            if (confirm("Are you sure you want to reset all learning progress?")) {
                gameState.stars = 0;
                gameState.wordsLearned = 0;
                gameState.correctAnswers = 0;
                gameState.timePlayed = 0;
                saveStats();
                renderParentDashboard();
            }
        }

        // Initialize app on load
        window.onload = function() {
            loadStats();
            renderHomeScreen();
        };
    </script>
</body>
</html>
