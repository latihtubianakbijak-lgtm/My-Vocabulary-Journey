        function speak(text) {
            if (!state.soundEnabled) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.9;
                utterance.pitch = 1.4;
                window.speechSynthesis.speak(utterance);
            }
        }

        function teacherTalk(message) {
            document.getElementById('teacher-speech').innerText = `"${message}"`;
            speak(message);
        }

        function toggleAudio() {
            state.soundEnabled = !state.soundEnabled;
            const btn = document.getElementById('audio-toggle-btn');
            btn.innerHTML = state.soundEnabled ? '<span class="icon-3d">🔊</span>' : '<span class="icon-3d">🔇</span>';
            btn.classList.toggle('bg-pink-400', state.soundEnabled);
            btn.classList.toggle('bg-gray-400', !state.soundEnabled);
        }

        function updateStatsDisplay() {
            document.getElementById('star-count').innerText = state.stars;
            document.getElementById('coin-count').innerText = state.coins;
        }

        function router(view, param = null) {
            state.currentView = view;
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            if (view === 'home') {
                renderHome(container);
            } else if (view === 'learn-menu') {
                renderLearnMenu(container);
            } else if (view === 'vocab-session') {
                state.activeCategory = param || 'VEGETABLES';
                state.currentIndex = 0;
                renderVocabSession(container);
            } else if (view === 'story-adventure') {
                renderStoryAdventure(container);
            } else if (view === 'games-menu') {
                renderGamesMenu(container);
            } else if (view === 'game-play') {
                renderGamePlay(container, param);
            } else if (view === 'exam') {
                renderExam(container);
            } else if (view === 'progress') {
                renderProgress(container);
            } else if (view === 'rewards') {
                renderRewards(container);
            }
            updateStatsDisplay();
        }

            return icons[cat] || '🌟';
        }

                    <button onclick="router('home')" class="bg-gray-200 font-kids px-3 py-1.5 rounded-2xl text-xs md:text-sm text-gray-700"><span class="icon-3d">⬅️</span> Home</button>
                    <h2 class="font-kids text-lg md:text-2xl text-indigo-700"><span class="icon-3d">📊</span> My Learning Progress</h2>
                    <div></div>
                </div>
                <div class="grid grid-cols-2 gap-3 w-full max-w-md mb-3">
                    <div class="bg-yellow-100 border-4 border-yellow-300 p-3 rounded-3xl text-center shadow-sm">
                        <span class="text-3xl icon-3d">📚</span>
                        <h3 class="font-kids text-xl md:text-2xl text-yellow-700 mt-1">${state.vocabularyLearned}</h3>
                        <p class="text-xs font-semibold text-gray-600">Words Learned</p>
                    </div>
                    <div class="bg-sky-100 border-4 border-sky-300 p-3 rounded-3xl text-center shadow-sm">
                        <span class="text-3xl icon-3d">🎮</span>
                        <h3 class="font-kids text-xl md:text-2xl text-sky-700 mt-1">${state.gamesCompleted}</h3>
                        <p class="text-xs font-semibold text-gray-600">Games Completed</p>
                    </div>
                </div>
                <div class="bg-indigo-50 border-4 border-indigo-200 p-3 rounded-3xl text-center w-full max-w-md">
                    <h4 class="font-kids text-indigo-800 text-xs">Parent Summary:</h4>
                    <p class="text-xs text-gray-700 font-semibold mt-1">"My child learned ${state.vocabularyLearned} words and completed ${state.gamesCompleted} fun activities successfully!"[cite: 1]</p>
                </div>
            `;
        }

        function renderRewards(container) {
            teacherTalk("Yay! Spend your earned coins on awesome badges and stickers!");
            container.innerHTML = `
                <div class="w-full flex justify-between items-center mb-3">
                    <button onclick="router('home')" class="bg-gray-200 font-kids px-3 py-1.5 rounded-2xl text-xs md:text-sm text-gray-700"><span class="icon-3d">⬅️</span> Home</button>
                    <h2 class="font-kids text-lg md:text-2xl text-amber-700"><span class="icon-3d">🎁</span> Rewards & Stickers</h2>
                    <div></div>
                </div>
                <div class="grid grid-cols-3 gap-3 w-full max-w-md text-center">
                    <div class="bg-white border-4 border-amber-200 p-3 rounded-3xl shadow-md">
                        <span class="text-4xl icon-3d">👑</span>
                        <p class="font-kids text-xs md:text-sm mt-1">Golden Crown</p>
                        <button onclick="buyReward(30)" class="mt-2 bg-amber-400 hover:bg-amber-500 text-white font-kids text-xs px-2.5 py-1 rounded-xl shadow">30 <span class="icon-3d">🪙</span></button>
                    </div>
                    <div class="bg-white border-4 border-amber-200 p-3 rounded-3xl shadow-md">
                        <span class="text-4xl icon-3d">🦄</span>
                        <p class="font-kids text-xs md:text-sm mt-1">Magic Unicorn</p>
                        <button onclick="buyReward(50)" class="mt-2 bg-amber-400 hover:bg-amber-500 text-white font-kids text-xs px-2.5 py-1 rounded-xl shadow">50 <span class="icon-3d">🪙</span></button>
                    </div>
                    <div class="bg-white border-4 border-amber-200 p-3 rounded-3xl shadow-md">
                        <span class="text-4xl icon-3d">🚀</span>
                        <p class="font-kids text-xs md:text-sm mt-1">Space Rocket</p>
                        <button onclick="buyReward(40)" class="mt-2 bg-amber-400 hover:bg-amber-500 text-white font-kids text-xs px-2.5 py-1 rounded-xl shadow">40 <span class="icon-3d">🪙</span></button>
                    </div>
                </div>
            `;
        }

        function buyReward(cost) {
            if (state.coins >= cost) {
                state.coins -= cost;
                updateStatsDisplay();
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                teacherTalk("Yippee! You unlocked a wonderful new reward!");
            } else {
                teacherTalk("Oopsie! You need more coins. Play mini-games to earn more!");
            }
        }

        function syncToCloud() {
            if (window.db && window.dbSet && window.dbRef) {
                window.dbSet(window.dbRef(window.db, 'user_progress/child_hero'), {
                    stars: state.stars,
                    coins: state.coins,
                    vocabularyLearned: state.vocabularyLearned,
                    gamesCompleted: state.gamesCompleted,
                    lastUpdated: new Date().toISOString()
                }).then(() => {
                    teacherTalk("Cloud sync successful! Progress saved safely.");
                }).catch((error) => {
                    teacherTalk("Cloud sync failed. Playing offline smoothly!");
                });
            } else {
                teacherTalk("Progress saved locally!");
            }
        }

        window.onload = function() {
            router('home');
        };
    </script>
</body>
</html>
