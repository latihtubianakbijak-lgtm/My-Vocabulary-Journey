        // --- WEB AUDIO SYNTHESIZER & SOUND ENGINE ---
        let audioCtx = null;
        let bgmInterval = null;
        let currentBgmTheme = 'home';

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

        // Vocabulary Voice Pronunciation (SpeechSynthesis API)
        function speakWord(word) {
            if (!gameState.voiceEnabled) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; // Slow and easy for kids aged 4-7
                utterance.pitch = 1.1; // Child-friendly warm pitch
                window.speechSynthesis.speak(utterance);
            }
        }

        // SFX Generator
        function playSfx(type) {
            if (!gameState.sfxEnabled) return;
            initAudioContext();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            if (type === 'click') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'correct') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + index * 0.08);
                    gain.gain.setValueAtTime(0.2, now + index * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + index * 0.08);
                    osc.stop(now + index * 0.08 + 0.3);
                });
            } else if (type === 'star') {
                const notes = [880, 1174.66, 1318.51, 1760];
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + index * 0.06);
                    gain.gain.setValueAtTime(0.15, now + index * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.06 + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + index * 0.06);
                    osc.stop(now + index * 0.06 + 0.2);
                });
            } else if (type === 'wrong') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(330, now);
                osc.frequency.setValueAtTime(392, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'achievement') {
                const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51];
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + index * 0.1);
                    gain.gain.setValueAtTime(0.25, now + index * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + index * 0.1);
                    osc.stop(now + index * 0.1 + 0.4);
                });
            }
        }

        // BGM Sequencer
        function startBgm(theme = 'home') {
            currentBgmTheme = theme;
            stopBgm();
            if (!gameState.musicEnabled) return;
            initAudioContext();

            const scales = {
                home: [261.63, 293.66, 329.63, 392.00, 523.25],
                beginner: [329.63, 392.00, 440.00, 523.25, 659.25],
                advanced: [220.00, 246.94, 293.66, 329.63, 392.00],
                category: [293.66, 329.63, 392.00, 440.00, 587.33],
                result: [392.00, 440.00, 523.25, 659.25, 783.99]
            };

            const notes = scales[theme] || scales.home;

            bgmInterval = setInterval(() => {
                if (!gameState.musicEnabled || !audioCtx) return;
                try {
                    const now = audioCtx.currentTime;
                    const freq = notes[Math.floor(Math.random() * notes.length)];
                    
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = theme === 'advanced' ? 'triangle' : 'sine';
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.03, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now);
                    osc.stop(now + 0.6);
                } catch(e) {}
            }, 500);
        }

        function stopBgm() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

                    </div>

                    <h2 class="font-fun text-3xl text-purple-700 mb-2">Who Am I?</h2>
                    
                    <div class="w-32 h-32 sm:w-40 sm:h-40 bg-purple-100 rounded-3xl flex items-center justify-center border-4 border-dashed border-purple-300 mb-4 shadow-inner">
                        <span class="text-6xl sm:text-7xl animate-pulse">❓</span>
                    </div>

                    <div class="w-full bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 mb-6 text-center shadow-sm">
                        <span class="text-xs font-bold uppercase tracking-wider text-amber-600 block mb-1">Clue ${gameState.currentClueIndex + 1} of ${maxClues} (${gameState.currentClueIndex === 0 ? 'Easy' : gameState.currentClueIndex === 1 ? 'Medium' : 'Hard'})</span>
                        <p class="font-fun text-xl sm:text-2xl text-slate-700" id="clue-text">"${currentClue}"</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 w-full">
                        ${choices.map((choice) => `
                            <button onclick="checkAdvancedAnswer('${choice.name}', '${currentItem.name}')" class="btn-3d bg-purple-100 hover:bg-purple-200 border-3 border-purple-300 p-4 rounded-2xl flex flex-col items-center justify-center gap-2 transition-transform active:scale-95">
                                <span class="text-3xl">${choice.emoji}</span>
                                <span class="font-fun text-purple-800 text-lg">${choice.name}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkAdvancedAnswer(selectedName, correctName) {
            playSfx('click');
            const currentItem = vocabData[gameState.currentCategory].find(i => i.name === correctName);
            const maxClues = currentItem.clues.length;

            if (selectedName === correctName) {
                let earnedStars = 3 - gameState.attemptCount;
                if (earnedStars < 1) earnedStars = 1;

                gameState.stars += earnedStars;
                gameState.correctAnswers += 1;
                gameState.advancedCluesMastered++;
                saveStats();
                playSfx('correct');
                playSfx('star');
                startBgm('result');

                if (typeof confetti === 'function') {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                }

                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <div class="w-full max-w-xl flex flex-col items-center bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl border-4 border-emerald-300 text-center animate-pulse-scale">
                        <div class="text-7xl mb-2">🎉</div>
                        <h2 class="font-fun text-4xl text-emerald-600 mb-2">Great Job!</h2>
                        <p class="font-fun text-2xl text-slate-700 mb-4">It's a ${currentItem.name} ${currentItem.emoji}</p>
                        <div class="bg-emerald-50 border-2 border-emerald-200 px-6 py-3 rounded-2xl mb-6 font-fun text-xl text-emerald-700">
                            ⭐ +${earnedStars} Stars Earned!
                        </div>
                        <button onclick="playSfx('click'); nextAdvancedQuestion()" class="btn-3d bg-emerald-500 hover:bg-emerald-600 text-white font-fun text-xl py-3 px-8 rounded-2xl">
                            Next Question ➡
                        </button>
                    </div>
                `;
            } else {
                playSfx('wrong');
                gameState.attemptCount++;
                if (gameState.currentClueIndex < maxClues - 1) {
                    gameState.currentClueIndex++;
                    renderAdvancedQuestion();
                } else {
                    showIncorrectAdvancedFeedback(currentItem);
                }
            }
        }

        function showIncorrectAdvancedFeedback(currentItem) {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full max-w-xl flex flex-col items-center bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl border-4 border-rose-300 text-center">
                    <div class="text-6xl mb-2">💡</div>
                    <h2 class="font-fun text-3xl text-rose-500 mb-2">Good Try!</h2>
                    <p class="font-fun text-xl text-slate-700 mb-4">The correct answer was a ${currentItem.name} ${currentItem.emoji}</p>
                    <button onclick="playSfx('click'); nextAdvancedQuestion()" class="btn-3d bg-rose-400 hover:bg-rose-500 text-white font-fun text-xl py-3 px-8 rounded-2xl">
                        Continue ➡
                    </button>
                </div>
            `;
        }

        function nextAdvancedQuestion() {
            startBgm('advanced');
            gameState.currentQuestionIndex++;
            gameState.currentClueIndex = 0;
            gameState.attemptCount = 0;
            renderAdvancedQuestion();
        }

        function renderVictoryScreen() {
            startBgm('result');
            playSfx('achievement');
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full max-w-xl flex flex-col items-center bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl border-4 border-amber-300 text-center">
                    <div class="text-7xl mb-2">🏆</div>
                    <h2 class="font-fun text-4xl text-amber-500 mb-2">Fantastic!</h2>
                    <p class="font-fun text-xl text-slate-700 mb-6">You finished all questions in this category!</p>
                    <div class="flex gap-4 justify-center">
                        <button onclick="playSfx('click'); renderLevelSelection('game')" class="btn-3d bg-purple-500 hover:bg-purple-600 text-white font-fun text-lg py-3 px-6 rounded-2xl">
                            More Games 🎮
                        </button>
                        <button onclick="playSfx('click'); renderHomeScreen()" class="btn-3d bg-sky-400 hover:bg-sky-500 text-white font-fun text-lg py-3 px-6 rounded-2xl">
                            Home 🏠
                        </button>
                    </div>
                </div>
            `;
            if (typeof confetti === 'function') {
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 } });
            }
        }

        // --- LEARN WORDS MODE (UPDATED WITH AUTOMATIC VOICE & REPLAY BUTTON) ---
        function startLearnMode(categoryName) {
            startBgm('beginner');
            const items = vocabData[categoryName];
            let currentIndex = 0;

            function renderCard() {
                const item = items[currentIndex];
                
                // Automatically play pronunciation voice when card opens
                speakWord(item.name);

                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <div class="w-full max-w-xl flex flex-col items-center bg-white/95 backdrop-blur-md p-6 sm:p-8 rounded-3xl shadow-2xl border-4 border-amber-300">
                        <div class="w-full flex justify-between items-center mb-4">
                            <button onclick="playSfx('click'); renderLearnCategorySelection()" class="bg-amber-100 hover:bg-amber-200 px-3 py-1 rounded-xl font-fun text-amber-700 text-sm">
                                ⬅ Categories
                            </button>
                            <span class="font-fun text-amber-600">${currentIndex + 1} / ${items.length}</span>
                        </div>

                        <div class="w-48 h-48 sm:w-56 sm:h-56 bg-amber-50 rounded-3xl flex flex-col items-center justify-center border-4 border-amber-200 mb-4 shadow-md relative">
                            <span class="text-8xl sm:text-9xl mb-2 animate-bounce-slow">${item.emoji}</span>
                        </div>

                        <div class="flex flex-col items-center gap-2 mb-3">
                            <h2 class="font-fun text-3xl sm:text-4xl text-purple-700 uppercase tracking-wide">${item.name}</h2>
                            <button onclick="playSfx('click'); speakWord('${item.name}')" class="btn-3d bg-rose-400 hover:bg-rose-500 text-white font-fun px-4 py-2 rounded-2xl shadow-md flex items-center gap-2 text-sm transition-transform active:scale-95" title="Listen Again">
                                <span>🔊</span> <span>Listen Again</span>
                            </button>
                        </div>

                        <div class="bg-purple-50 border-2 border-purple-200 rounded-2xl p-4 w-full text-center mb-6">
                            <p class="font-fun text-lg sm:text-xl text-slate-700">"${item.sentence}"</p>
                        </div>

                        <div class="flex justify-between w-full gap-4">
                            <button onclick="playSfx('click'); prevCard()" ${currentIndex === 0 ? 'disabled class="opacity-50 cursor-not-allowed btn-3d bg-slate-300 text-white font-fun px-6 py-3 rounded-2xl flex-1"' : 'class="btn-3d bg-amber-400 hover:bg-amber-500 text-white font-fun px-6 py-3 rounded-2xl flex-1"'}>
                                ⬅ Prev
                            </button>
                            <button onclick="playSfx('click'); nextCard()" ${currentIndex === items.length - 1 ? 'disabled class="opacity-50 cursor-not-allowed btn-3d bg-slate-300 text-white font-fun px-6 py-3 rounded-2xl flex-1"' : 'class="btn-3d bg-emerald-400 hover:bg-emerald-500 text-white font-fun px-6 py-3 rounded-2xl flex-1"'}>
                                Next ➡
                            </button>
                        </div>
                    </div>
                `;
            }

            window.nextCard = function() {
                if (currentIndex < items.length - 1) {
                    currentIndex++;
                    renderCard();
                }
            };

            window.prevCard = function() {
                if (currentIndex > 0) {
                    currentIndex--;
                    renderCard();
                }
            };

            renderCard();
        }

        // --- REWARDS & PROGRESS SYSTEM ---
        function renderRewards() {
            startBgm('home');
            const stars = gameState.stars;
            let badge = "Beginner Learner";
            if (stars >= 50) badge = "Vocabulary Master 🏆";
            else if (stars >= 30) badge = "Clue Detective 🔍";
            else if (stars >= 10) badge = "Word Explorer 🌱";

            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full max-w-xl flex flex-col items-center bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl border-4 border-sky-300 text-center">
                    <div class="w-full flex justify-between items-center mb-4">
                        <button onclick="playSfx('click'); renderHomeScreen()" class="bg-sky-100 hover:bg-sky-200 px-3 py-1 rounded-xl font-fun text-sky-700 text-sm">
                            ⬅ Home
                        </button>
                        <h2 class="font-fun text-2xl text-sky-700">My Rewards & Progress</h2>
                        <div class="w-12"></div>
                    </div>

                    <div class="text-7xl mb-3 animate-bounce-slow">🏆</div>
                    <div class="font-fun text-4xl text-amber-500 mb-1">${stars} Stars</div>
                    <p class="font-fun text-xl text-purple-600 mb-6">Current Badge: <span class="text-rose-500">${badge}</span></p>

                    <div class="w-full flex flex-col gap-3 mb-6">
                        <div class="bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-4 text-left">
                            <span class="font-fun text-emerald-700 block text-sm mb-1">🌱 Beginner Progress (Words Learned)</span>
                            <div class="w-full bg-emerald-200 rounded-full h-4 overflow-hidden mb-1">
                                <div class="bg-emerald-500 h-full rounded-full" style="width: ${Math.min(100, (gameState.beginnerWordsLearned / totalVocabularyCount) * 100)}%;"></div>
                            </div>
                            <span class="text-xs font-bold text-slate-600">${gameState.beginnerWordsLearned} / ${totalVocabularyCount} words completed</span>
                        </div>

                        <div class="bg-purple-50 border-2 border-purple-200 rounded-2xl p-4 text-left">
                            <span class="font-fun text-purple-700 block text-sm mb-1">🚀 Advanced Progress (Clues Mastered)</span>
                            <div class="w-full bg-purple-200 rounded-full h-4 overflow-hidden mb-1">
                                <div class="bg-purple-500 h-full rounded-full" style="width: ${Math.min(100, (gameState.advancedCluesMastered / totalVocabularyCount) * 100)}%;"></div>
                            </div>
                            <span class="text-xs font-bold text-slate-600">${gameState.advancedCluesMastered} / ${totalVocabularyCount} words mastered</span>
                        </div>
                    </div>

                    <div class="w-full bg-sky-50 border-2 border-sky-200 rounded-2xl p-4 flex flex-col gap-3 text-left">
                        <div class="flex items-center justify-between font-fun text-slate-700">
                            <span>🌱 Word Explorer (Complete Beginner)</span>
                            <span>${gameState.beginnerWordsLearned >= totalVocabularyCount ? '✅' : '🔒'}</span>
                        </div>
                        <div class="flex items-center justify-between font-fun text-slate-700">
                            <span>🔍 Clue Detective (50 Advanced)</span>
                            <span>${gameState.advancedCluesMastered >= 50 ? '✅' : '🔒'}</span>
                        </div>
                        <div class="flex items-center justify-between font-fun text-slate-700">
                            <span>🏆 Vocabulary Master (All Categories)</span>
                            <span>${(gameState.beginnerWordsLearned >= totalVocabularyCount && gameState.advancedCluesMastered >= totalVocabularyCount) ? '✅' : '🔒'}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- PARENT MODE ---
        let mathA = 3;
        let mathB = 4;

        function openParentMode() {
            playSfx('click');
            mathA = Math.floor(Math.random() * 5) + 1;
            mathB = Math.floor(Math.random() * 5) + 1;
            document.getElementById('math-question').innerText = `${mathA} + ${mathB} = ?`;
            document.getElementById('math-answer').value = '';
            document.getElementById('pin-modal').classList.remove('hidden');
        }

        function closeParentMode() {
            playSfx('click');
            document.getElementById('pin-modal').classList.add('hidden');
        }

        function verifyPin() {
            const val = parseInt(document.getElementById('math-answer').value);
            if (val === mathA + mathB) {
                playSfx('correct');
                closeParentMode();
                renderParentDashboard();
            } else {
                playSfx('wrong');
                alert("Incorrect answer! Try again.");
            }
        }

        function renderParentDashboard() {
            const minutesPlayed = Math.floor(gameState.timePlayed / 60);
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full max-w-xl flex flex-col items-center bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl border-4 border-purple-400">
                    <div class="w-full flex justify-between items-center mb-4">
                        <button onclick="playSfx('click'); renderHomeScreen()" class="bg-purple-100 hover:bg-purple-200 px-3 py-1 rounded-xl font-fun text-purple-700 text-sm">
                            ⬅ Exit Parent Mode
                        </button>
                        <h2 class="font-fun text-2xl text-purple-700">👨‍👩‍👧 Parent Dashboard</h2>
                        <div class="w-12"></div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 w-full mb-6">
                        <div class="bg-purple-50 border-2 border-purple-200 p-4 rounded-2xl text-center">
                            <span class="text-3xl block mb-1">⭐</span>
                            <span class="font-fun text-2xl text-purple-700">${gameState.stars}</span>
                            <p class="text-xs text-slate-500 font-bold uppercase">Stars Collected</p>
                        </div>
                        <div class="bg-emerald-50 border-2 border-emerald-200 p-4 rounded-2xl text-center">
                            <span class="text-3xl block mb-1">🌱</span>
                            <span class="font-fun text-2xl text-emerald-700">${gameState.beginnerWordsLearned}</span>
                            <p class="text-xs text-slate-500 font-bold uppercase">Beginner Learned</p>
                        </div>
                        <div class="bg-amber-50 border-2 border-amber-200 p-4 rounded-2xl text-center">
                            <span class="text-3xl block mb-1">🚀</span>
                            <span class="font-fun text-2xl text-amber-700">${gameState.advancedCluesMastered}</span>
                            <p class="text-xs text-slate-500 font-bold uppercase">Advanced Mastered</p>
                        </div>
                        <div class="bg-sky-50 border-2 border-sky-200 p-4 rounded-2xl text-center">
                            <span class="text-3xl block mb-1">⏱️</span>
                            <span class="font-fun text-2xl text-sky-700">${minutesPlayed} min</span>
                            <p class="text-xs text-slate-500 font-bold uppercase">Time Played</p>
                        </div>
                    </div>

                    <button onclick="resetStats()" class="bg-rose-100 hover:bg-rose-200 text-rose-600 font-fun px-4 py-2 rounded-xl text-sm">
                        Reset Progress
                    </button>
                </div>
            `;
        }

        function resetStats() {
            if (confirm("Are you sure you want to reset all learning progress?")) {
                gameState.stars = 0;
                gameState.beginnerWordsLearned = 0;
                gameState.advancedCluesMastered = 0;
                gameState.correctAnswers = 0;
                gameState.timePlayed = 0;
                saveStats();
                renderParentDashboard();
            }
        }

        // Initialize app on load
        window.onload = function() {
            loadStats();
            renderHomeScreen();
        };
    </script>
</body>
</html>
